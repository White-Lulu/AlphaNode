<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="alpha-node.png?v=2">
  <meta name="description" content="全球行业与企业数据，财报筛选、区域行业基准和市场分析。">
  <title>AlphaNode · 全球行业数据图谱</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="research.css">
  <link rel="stylesheet" href="theme-preview.css">
  <link rel="stylesheet" href="chain.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://github.com/White-Lulu/AlphaNode" target="_blank" rel="noopener"
      aria-label="AlphaNode on GitHub" data-aria-zh="在 GitHub 查看 AlphaNode" data-aria-en="View AlphaNode on GitHub"><img class="brand-icon" src="alpha-node.png?v=2" width="26" height="26" alt=""><span>AlphaNode</span></a>
    <div id="topbar-title">
      <div id="atlas-heading" class="intro-title">
        <h1 id="title" data-zh="全球行业数据图谱" data-en="Industry Data Atlas"></h1>
        <span id="subtitle" class="intro-subtitle" data-zh="企业财报、行业统计和产品市场" data-en="Company financials, industry statistics and product markets"></span>
      </div>
      <div id="collection-heading" class="intro-title" hidden>
        <h1 data-zh="我的工作台" data-en="My workbench"></h1>
        <span class="intro-subtitle" data-zh="自选企业与已保存图表" data-en="Watchlist and saved charts"></span>
      </div>
      <div id="chain-heading" class="intro-title" hidden>
        <h1 data-zh="产业链图谱" data-en="Value Chain Atlas"></h1>
        <span class="intro-subtitle" data-zh="物料、工具与直接消费" data-en="Materials, tools and direct consumption"></span>
      </div>
    </div>
    <div class="top-actions">
      <nav class="module-nav" data-aria-zh="页面" data-aria-en="Pages">
        <button type="button" class="quiet" data-module="atlas" aria-current="page" data-zh="全球行业数据图谱" data-en="Industry Data Atlas"></button>
        <button type="button" class="quiet" data-module="collection" data-zh="工作台" data-en="Workbench"></button>
        <button type="button" class="quiet" data-module="chains" data-zh="产业链图谱" data-en="Value Chain Atlas"></button>
      </nav>
      <button type="button" id="settings" class="quiet" data-zh="设置" data-en="Settings"></button>
    </div>
  </header>

  <main>
    <div id="workspace" data-view="split">
      <div id="work-area">
        <section id="collection" hidden>
          <details class="panel" open>
            <summary id="watchlist-title"><span><span data-zh="自选企业" data-en="Watchlist"></span><span id="watchlist-count" class="collection-count"></span></span></summary>
            <div class="collection-block">
            <div class="filter-bar watch-toolbar">
              <button type="button" id="watch-toggle-filters" class="quiet filter-toggle" aria-controls="watch-filters" aria-expanded="true" data-zh="筛选" data-en="Filters"></button>
              <div class="search-control"><input type="search" id="watch-search" autocomplete="off" data-aria-zh="搜索企业或代码" data-aria-en="Search company or ticker" data-ph-zh="搜索企业或代码" data-ph-en="Search company or ticker"></div>
              <div class="table-actions">
                <button type="button" id="watch-collapse" class="quiet" data-zh="收起全部" data-en="Collapse all"></button>
                <button type="button" id="watch-export" class="quiet" data-zh="导出 CSV" data-en="Export CSV"></button>
              </div>
            </div>
            <div id="watch-filters" class="watch-filters">
              <label class="control"><span data-zh="地域范围" data-en="Geographic scope"></span><select id="watch-scope"></select></label>
              <div class="control"><span id="watch-country-title" data-zh="归属经济体" data-en="Issuer economy"></span><div id="watch-country"></div></div>
              <label class="control"><span data-zh="分类方式" data-en="Classification"></span><select id="watch-classification"></select></label>
              <div class="control"><span id="watch-industry-title" data-zh="行业分组" data-en="Industry group"></span><div id="watch-industry"></div></div>
              <label class="control"><span data-zh="观察年度" data-en="Observation year"></span><select id="watch-year"></select></label>
              <label class="control"><span data-zh="时间基准" data-en="Time basis"></span><select id="watch-mode"></select></label>
              <button type="button" id="watch-columns" class="quiet" data-zh="指标列" data-en="Columns"></button>
            </div>
            <div class="table-scroll watch-scroll" tabindex="0" aria-labelledby="watchlist-title">
              <table id="watch-table"><thead id="watch-head"></thead><tbody id="collection-watchlist"></tbody></table>
            </div>
            <div class="table-footer"><p id="watch-status" class="status" role="status" hidden></p><div id="watch-pagination"></div></div>
            </div>
          </details>
          <details class="panel saved-library" open>
            <summary id="saved-charts-title">
              <span><span data-zh="已保存图表" data-en="Saved charts"></span><span id="saved-chart-count" class="collection-count"></span></span>
              <span class="saved-library-actions">
                <button id="new-saved-folder" type="button" class="quiet" data-zh="＋ 分类夹" data-en="+ Folder"></button>
              </span>
            </summary>
            <div class="collection-block">
              <form id="saved-folder-form" class="saved-inline-editor" hidden>
                <input id="saved-folder-name" type="text" maxlength="100" required autocomplete="off"
                  data-aria-zh="分类夹名称" data-aria-en="Folder name" data-ph-zh="分类夹名称" data-ph-en="Folder name">
                <button type="submit" class="quiet" data-zh="创建" data-en="Create"></button>
                <button type="button" class="quiet" id="cancel-saved-folder" data-zh="取消" data-en="Cancel"></button>
              </form>
              <p id="saved-status" class="hint-copy" role="status" hidden></p>
              <div id="saved-charts"></div>
            </div>
          </details>
        </section>
        <div class="splitter" role="separator" aria-orientation="vertical" aria-controls="collection collection-workbench" tabindex="0"
          data-resize="collection-work-area" data-aria-zh="调整数据展台与图表工作台的宽度" data-aria-en="Resize the data gallery and chart workbench"></div>
        <section id="collection-workbench" class="panel comparison" aria-labelledby="collection-workbench-title" hidden>
          <div class="comparison-head bench-head">
            <h2 id="collection-workbench-title" data-zh="图表工作台" data-en="Chart workbench"></h2>
            <div class="bench-actions">
              <button id="select-bench-rows" type="button" class="quiet" aria-pressed="false" aria-controls="collection-charts"
                data-zh="选择图表行" data-en="Select chart rows"></button>
              <button id="merge-saved-charts" type="button" class="primary" hidden disabled data-zh="合并保存" data-en="Merge and save"></button>
            </div>
          </div>
          <div id="collection-charts" class="bench-charts"></div>
        </section>
        <section id="explorer" class="panel explorer" data-aria-zh="数据浏览" data-aria-en="Data explorer">
          <nav class="tabs" aria-label="Views">
            <button type="button" aria-current="page" data-tab="finance" data-zh="行业财务" data-en="Industry financials"></button>
            <button type="button" data-tab="screen" data-zh="企业筛选" data-en="Company screener"></button>
            <button type="button" data-tab="benchmark" data-zh="行业基准" data-en="Industry benchmarks"></button>
            <button type="button" data-tab="statistics" data-zh="官方统计" data-en="Official statistics"></button>
            <button type="button" data-tab="markets" data-zh="产品市场" data-en="Product markets"></button>
            <button type="button" data-tab="directory" data-zh="证券目录" data-en="Securities directory"></button>
          </nav>

          <div id="financial-view" class="explorer-view">
            <div class="filter-bar">
              <button type="button" class="quiet filter-toggle" data-toggle-filters="financial" aria-controls="financial-filters" aria-expanded="true" data-zh="筛选" data-en="Filters"></button>
              <div class="search-control">
                <label for="search" class="sr-only" data-zh="搜索行业、企业或代码" data-en="Search industry, company or ticker"></label>
                <input type="search" id="search" autocomplete="off" data-ph-zh="搜索行业、企业或代码" data-ph-en="Search industry, company or ticker">
              </div>
              <div class="table-actions">
                <button id="collapse" type="button" class="quiet" data-zh="收起全部" data-en="Collapse all"></button>
                <button id="export" type="button" class="quiet" data-zh="导出 CSV" data-en="Export CSV"></button>
              </div>
            </div>
            <div id="financial-content" class="explorer-content">
              <div id="financial-filters" class="filter-pane">
                <button type="button" class="filter-help" popovertarget="table-note" data-aria-zh="筛选说明" data-aria-en="Filter help">?</button>
                <div id="table-note" class="filter-note" popover></div>
                <div class="controls" id="main-controls">
                  <div id="scope-control" class="control">
                    <span class="control-label" id="scope-title" data-zh="地域范围" data-en="Geographic scope"></span>
                    <div class="scope" role="group" aria-labelledby="scope-title">
                      <label><input type="checkbox" id="scope-cn" checked><span data-zh="中国大陆" data-en="Mainland China"></span></label>
                      <label><input type="checkbox" id="scope-ex" checked><span data-zh="海外" data-en="Overseas"></span></label>
                    </div>
                  </div>
                  <div class="control" id="benchmark-control" hidden><label for="benchmark-region" data-zh="基准区域" data-en="Benchmark region"></label><div class="select-with-help"><select id="benchmark-region"></select></div></div>
                  <div class="control" id="screen-country-control" hidden><span id="screen-country-title" data-zh="经营归属经济体" data-en="Issuer economy"></span><div id="screen-country"></div></div>
                  <div class="control" id="classification-control">
                    <label for="classification" data-zh="分类方式" data-en="Classification"></label>
                    <select id="classification" aria-describedby="classification-status" disabled>
                      <option value="isic">ISIC Rev.4</option>
                      <option value="economic" data-zh="产业链功能" data-en="Economic function"></option>
                    </select>
                    <span id="classification-status" class="sr-only" role="status"></span>
                  </div>
                  <div class="control" id="screen-industry-control" hidden><span id="screen-industry-title" data-zh="行业分组" data-en="Industry group"></span><div id="screen-industry"></div></div>
                  <div class="control" id="start-level-control">
                    <label for="start-level" data-zh="起始层级" data-en="Starting level"></label>
                    <select id="start-level">
                      <option value="1" data-zh="一级行业" data-en="Level 1 industries"></option>
                      <option value="2" data-zh="二级行业" data-en="Level 2 industries"></option>
                      <option value="3" data-zh="三级行业" data-en="Level 3 industries"></option>
                      <option value="4" data-zh="企业" data-en="Companies"></option>
                    </select>
                  </div>
                  <div class="control" id="period-controls">
                    <label for="year" data-zh="观察年度" data-en="Observation year"></label><select id="year"></select>
                  </div>
                  <div class="control"><label for="series-mode" data-zh="时间基准" data-en="Time basis"></label><div class="select-with-help"><select id="series-mode"></select></div></div>
                  <div class="control" id="aggregate-control">
                    <label for="aggregate" data-zh="行业财务聚合" data-en="Industry aggregation"></label>
                    <div class="select-with-help"><select id="aggregate"><option value="sum" data-zh="加总／加权" data-en="Sum / weighted"></option><option value="mean" data-zh="企业等权均值" data-en="Equal-weight mean"></option></select></div>
                  </div>
                  <div class="control" id="coverage-control">
                    <label for="company-coverage" data-zh="展示企业" data-en="Companies shown"></label>
                    <select id="company-coverage">
                      <option value="25">25%</option><option value="50" selected>50%</option>
                      <option value="75">75%</option><option value="100">100%</option>
                    </select>
                  </div>
                  <div class="control" id="source-control" hidden><label for="stat-source" data-zh="统计来源" data-en="Statistical source"></label><select id="stat-source"></select></div>
                  <label class="scope toggle" id="screen-watch-control" hidden><input type="checkbox" id="screen-only-watch"><span data-zh="仅看自选" data-en="Watchlist only"></span></label>
                  <button id="edit-columns" type="button" class="quiet" data-zh="指标列" data-en="Columns"></button>
                </div>
                <div id="screen-tools" class="screen-tools" hidden>
                  <h3 id="screen-preset-title" class="control-label" data-zh="筛选方案" data-en="Screen preset"></h3>
                  <div class="screen-buttons">
                    <div class="screen-preset-picker">
                      <select id="screen-preset" aria-labelledby="screen-preset-title"></select>
                      <button type="button" id="delete-preset" class="quiet" data-aria-zh="删除此方案" data-aria-en="Delete preset" hidden>×</button>
                    </div>
                    <button type="button" id="add-rule" class="quiet" data-zh="＋ 指标规则" data-en="+ Metric rule"></button>
                    <button type="button" id="reset-screen" class="quiet" data-zh="清空筛选" data-en="Clear filters"></button>
                    <button type="button" id="save-preset" class="quiet" data-zh="保存筛选方案" data-en="Save preset"></button>
                  </div>
                  <div id="rules"></div>
                  <details id="advanced-panel" class="advanced-panel">
                    <summary data-zh="高级表达式" data-en="Advanced expression"></summary>
                    <form id="advanced-form" class="pref-toolbar">
                      <label class="sr-only" for="advanced-input" data-zh="高级筛选表达式" data-en="Advanced screen expression"></label>
                      <input id="advanced-input" maxlength="2000" autocomplete="off" spellcheck="false" placeholder="roic >= 0.12 AND economy IN ('US', 'CN')">
                      <button type="submit" class="quiet" data-zh="应用表达式" data-en="Apply expression"></button>
                    </form>
                    <p id="advanced-status" role="status"></p>
                    <details><summary data-zh="字段、单位和示例" data-en="Fields, units and examples"></summary><div id="advanced-fields"></div></details>
                  </details>

                </div>
              </div>
              <div class="table-pane">
                <div class="table-tools">
                  <div id="table-context" class="table-context" tabindex="0" data-aria-zh="当前表格口径" data-aria-en="Current table settings"></div>
                </div>
                <div class="table-scroll" tabindex="0" data-aria-zh="年度数据表，可横向滚动" data-aria-en="Annual data table, horizontally scrollable">
                  <table id="grid"><thead id="grid-head"></thead><tbody id="grid-body"></tbody></table>
                </div>
                <div class="table-footer"><p id="status" class="status" role="status"></p><div id="table-pagination"></div></div>
              </div>
            </div>
          </div>
          <div id="directory-view" class="explorer-view" hidden>
            <div class="filter-bar">
              <button type="button" class="quiet filter-toggle" data-toggle-filters="directory" aria-controls="directory-filters" aria-expanded="true" data-zh="筛选" data-en="Filters"></button>
              <div class="search-control">
                <label for="dir-search" class="sr-only" data-zh="搜索证券名称、代码或 ISIN" data-en="Search name, ticker or ISIN"></label>
                <input type="search" id="dir-search" autocomplete="off" data-ph-zh="搜索证券名称、代码或 ISIN" data-ph-en="Search name, ticker or ISIN">
              </div>
            </div>
            <div id="directory-content" class="explorer-content">
              <div id="directory-filters" class="filter-pane">
                <button type="button" class="filter-help" popovertarget="directory-note" data-aria-zh="筛选说明" data-aria-en="Filter help">?</button>
                <div id="directory-note" class="filter-note" popover></div>
                <div id="directory-actions" class="directory-actions"></div>
              </div>
              <div id="directory-results" class="table-pane"></div>
            </div>
          </div>
        </section>

        <div class="splitter" role="separator" aria-orientation="vertical" aria-controls="explorer" tabindex="0"
          data-resize="work-area" data-aria-zh="调整表格与趋势的宽度" data-aria-en="Resize table and trends"></div>
        <section class="panel comparison" id="comparison" aria-labelledby="charts-title">
          <div class="comparison-head">
            <div><h2 id="charts-title" data-zh="趋势对照" data-en="Trend comparison"></h2></div>
            <button type="button" id="add-chart" class="primary" disabled data-zh="＋ 添加图表" data-en="+ Add chart"></button>
          </div>
          <div id="charts"></div>
        </section>
      </div>
      <div class="splitter" role="separator" aria-orientation="vertical" aria-controls="profile-panel" tabindex="0"
        data-resize="profile-width" data-aria-zh="调整企业详情宽度" data-aria-en="Resize company details"></div>
      <aside id="profile-panel" class="panel" aria-labelledby="profile-title" hidden><div id="profile"></div></aside>
    </div>

    <div id="chain-page" hidden aria-labelledby="chain-heading"></div>
    <footer id="workspace-footer">
      <nav id="atlas-views" class="workspace-nav" data-aria-zh="图谱视图" data-aria-en="Atlas views">
        <div class="view-tabs">
          <button class="quiet" type="button" data-view-panel="data" aria-controls="explorer" data-zh="数据表" data-en="Data table"></button>
          <button class="quiet" type="button" data-view-panel="trends" aria-controls="comparison" data-zh="趋势对照" data-en="Trend comparison"></button>
        </div>
      </nav>
      <nav id="collection-views" class="workspace-nav" data-aria-zh="工作台视图" data-aria-en="Workbench views" hidden>
        <div class="view-tabs">
          <button class="quiet" type="button" data-view-panel="data" aria-controls="collection" data-zh="数据展台" data-en="Data gallery"></button>
          <button class="quiet" type="button" data-view-panel="charts" aria-controls="collection-workbench" data-zh="图表工作台" data-en="Chart workbench"></button>
        </div>
      </nav>
      <a class="footer-project" href="https://github.com/White-Lulu/AlphaNode" target="_blank" rel="noopener"
        aria-label="© 2026 White-Lulu / AlphaNode on GitHub" data-aria-zh="在 GitHub 查看 © 2026 White-Lulu / AlphaNode" data-aria-en="View © 2026 White-Lulu / AlphaNode on GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/>
        </svg>
        <span>© 2026 White-Lulu / AlphaNode</span>
      </a>
      <div class="footer-data"><span id="version"></span>
        <button type="button" id="method" class="quiet" data-zh="数据说明" data-en="Methodology"></button>
      </div>
    </footer>
  </main>

  <dialog id="method-dialog" aria-labelledby="method-title" closedby="any">
    <div class="dialog-head"><h2 id="method-title" data-zh="数据说明与覆盖" data-en="Methodology & coverage"></h2></div>
    <div id="methods"></div>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title" closedby="any">
    <div class="dialog-head"><h2 id="settings-title" data-zh="设置" data-en="Settings"></h2></div>
    <h3 class="settings-block" data-zh="显示配置" data-en="Display configuration"></h3>
    <div class="settings-grid">
      <label class="control"><span data-zh="语言" data-en="Language"></span><select id="settings-language"></select></label>
      <label class="control"><span data-zh="主题" data-en="Theme"></span><select id="settings-theme"></select></label>
      <label class="control"><span data-zh="字体" data-en="Typeface"></span><select id="settings-font">
        <option value="" data-zh="系统字体" data-en="System"></option>
        <option value="serif" data-zh="思源宋体" data-en="Source Han Serif"></option>
      </select></label>
      <div class="control settings-table">
        <label for="settings-align" data-zh="表格对齐" data-en="Table alignment"></label>
        <div class="settings-table-row">
          <select id="settings-align">
            <option value="finance" data-zh="财务报表式（数值右对齐）" data-en="Financial (right-aligned)"></option>
            <option value="center" data-zh="集体居中" data-en="Centered"></option>
          </select>
          <div class="settings-hierarchy" role="group" data-aria-zh="表格层级显示" data-aria-en="Table hierarchy display">
            <label class="toggle"><input type="checkbox" id="settings-indent"><span data-zh="逐级缩进" data-en="Indent each level"></span></label>
            <label class="toggle"><input type="checkbox" id="settings-level-colors"><span data-zh="按层级着色" data-en="Color by level"></span></label>
            <label class="toggle"><input id="heat" type="checkbox" checked><span data-zh="热力色" data-en="Heat colors"></span></label>
          </div>
        </div>
      </div>
    </div>
    <h3 class="settings-block" data-zh="产业链图谱" data-en="Value chain graph"></h3>
    <div class="settings-grid" id="chain-settings-grid">
      <label class="control"><span data-zh="布局" data-en="Layout"></span><select id="chain-setting-direction">
        <option value="adaptive" data-zh="自适应" data-en="Adaptive"></option>
        <option value="horizontal" data-zh="横向" data-en="Horizontal"></option>
        <option value="vertical" data-zh="纵向" data-en="Vertical"></option>
      </select></label>
      <label class="control"><span data-zh="热力色顺序" data-en="Color order"></span><select id="chain-setting-ramp">
        <option value="dark" data-zh="由深到浅" data-en="Dark to light"></option>
        <option value="light" data-zh="由浅到深" data-en="Light to dark"></option>
      </select></label>
      <label class="control"><span data-zh="企业范围" data-en="Company scope"></span><select id="chain-setting-owned">
        <option value="full" data-zh="完整链条" data-en="Full pathway"></option>
        <option value="own" data-zh="仅企业环节" data-en="Company operations only"></option>
      </select></label>
      <label class="toggle"><input type="checkbox" id="chain-setting-shared"><span data-zh="合并同名节点" data-en="Merge matching nodes"></span></label>
    </div>
    <h3 class="settings-block" id="radar-settings-title" data-zh="同业对照雷达图" data-en="Peer radar chart"></h3>
    <div class="pref-toolbar">
      <button type="button" id="radar-defaults" class="quiet" data-zh="恢复默认六项" data-en="Restore default six metrics"></button>
      <span id="radar-selection-count" class="hint-copy" role="status"></span>
    </div>
    <div id="radar-metric-list" class="check-grid settings-list radar-metric-list" role="group" tabindex="0" aria-labelledby="radar-settings-title"></div>
    <h3 class="settings-block" id="term-settings-title" data-zh="术语解释" data-en="Term explanations"></h3>
    <div class="pref-toolbar">
      <label class="toggle"><input type="checkbox" id="hover-enabled"><span data-zh="悬停时显示" data-en="Show on hover"></span></label>
      <span id="term-coverage-count" class="hint-copy"></span>
    </div>
    <div class="pref-toolbar">
      <button type="button" id="terms-all" class="quiet" data-zh="全选" data-en="Enable all"></button>
      <button type="button" id="terms-none" class="quiet" data-zh="全部取消" data-en="Disable all"></button>
      <span class="hint-copy" data-zh="勾选的术语会在悬停时显示解释。" data-en="Enabled terms appear on hover."></span>
    </div>
    <div id="term-list" class="check-grid settings-list" role="group" tabindex="0" aria-labelledby="term-settings-title"></div>
    <h3 class="settings-block" data-zh="AI 图表分析" data-en="AI chart analysis"></h3>
    <p class="hint-copy" data-zh="自定义配置和个人 API Key 加密保存在当前浏览器。调用时，浏览器通过 HTTPS 直接向你选择的模型服务发送密钥和请求。"
      data-en="Custom settings and API keys are encrypted in this browser. Requests with a key go directly to your chosen model provider over HTTPS."></p>
    <form id="ai-settings-form" class="ai-settings">
      <div class="ai-first-row">
        <div id="ai-modes" class="ai-modes" role="group" data-aria-zh="配置模式" data-aria-en="Configuration mode">
          <div class="ai-default-choice">
            <button type="button" class="primary" data-ai-provider="default" aria-pressed="true" aria-describedby="ai-default-tip" data-zh="默认配置" data-en="Default configuration"></button>
            <span class="ai-default-tip" id="ai-default-tip" role="tooltip" data-zh="使用 AlphaNode 默认提供的 AI。" data-en="Use the AI provided by AlphaNode."></span>
          </div>
          <button type="button" class="quiet" data-ai-provider="custom" aria-pressed="false" data-zh="自定义配置" data-en="Custom configuration"></button>
        </div>
        <label class="control ai-interface"><span data-zh="接口类型" data-en="API type"></span><select id="ai-api-type" disabled>
          <option value="chat">OpenAI Chat Completions</option>
          <option value="responses">OpenAI Responses</option>
          <option value="anthropic">Anthropic Messages</option>
          <option value="gemini">Google Gemini</option>
        </select></label>
      </div>
      <fieldset id="ai-fields" class="ai-fields" disabled>
        <div class="ai-endpoint-row">
          <label class="control"><span>Base URL</span>
            <input type="url" id="ai-url" maxlength="2048" placeholder="https://api.openai.com/v1" spellcheck="false">
          </label>
          <div class="control"><label for="ai-key">API Key</label><div class="ai-key-control">
            <input type="password" id="ai-key" maxlength="1024" autocomplete="new-password" spellcheck="false">
            <button class="quiet" type="button" id="ai-show-key" aria-pressed="false" data-aria-zh="显示密钥" data-aria-en="Show API key">
              <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.2" fill="currentColor"/></svg>
            </button>
          </div></div>
        </div>
        <div class="ai-model-row">
          <div class="control"><label for="ai-model" data-zh="模型" data-en="Model"></label><div class="ai-model-control">
            <input type="text" id="ai-model" maxlength="150" autocomplete="off" spellcheck="false">
            <button type="button" id="ai-model-menu" class="quiet" popovertarget="ai-model-options" data-aria-zh="可用模型" data-aria-en="Available models"></button>
            <div id="ai-model-options" class="filter-picker ai-model-options" popover role="group" data-aria-zh="可用模型" data-aria-en="Available models"></div>
          </div></div>
          <button type="button" class="quiet" id="ai-fetch-models" data-zh="自动拉取" data-en="Fetch models"></button>
          <button type="button" class="quiet" id="ai-test-model" data-zh="测试连通" data-en="Test connection"></button>
        </div>
        <label class="control"><span data-zh="分析角度 Prompt" data-en="Analysis prompt"></span>
          <textarea id="ai-prompt" rows="2" maxlength="3000" data-ph-zh="例如：重点比较 2020 年后的变化" data-ph-en="Example: focus on changes since 2020"></textarea>
        </label>
      </fieldset>
      <p id="ai-settings-status" class="hint-copy" role="status"></p>
    </form>
  </dialog>
  <dialog id="save-chart-dialog" class="naming-dialog" aria-labelledby="save-chart-title" closedby="any">
    <form id="save-chart-form">
      <h2 id="save-chart-title" data-zh="保存图表" data-en="Save chart"></h2>
      <input type="text" id="saved-chart-input" maxlength="320" required autocomplete="off" data-aria-zh="图表名称" data-aria-en="Chart name">
      <p id="save-chart-status" class="hint-copy" role="status"></p>
      <div class="naming-dialog-actions">
        <button type="button" class="quiet" id="cancel-save-chart" data-zh="取消" data-en="Cancel"></button>
        <button type="submit" class="primary" data-zh="保存" data-en="Save"></button>
      </div>
    </form>
  </dialog>
  <dialog id="columns-dialog" aria-labelledby="columns-title" closedby="any">
    <div class="dialog-head"><h2 id="columns-title" data-zh="选择指标列" data-en="Choose columns"></h2></div>
    <div class="column-toolbar">
      <div id="column-groups" class="pref-toolbar"></div>
      <label class="toggle"><input type="checkbox" id="column-glossary"><span data-zh="显示术语介绍" data-en="Show term explanations"></span></label>
    </div>
    <div id="column-list" class="check-grid"></div>
  </dialog>
  <dialog id="preset-dialog" class="naming-dialog" aria-labelledby="preset-title" closedby="any">
    <form method="dialog" id="preset-form">
      <h2 id="preset-title" data-zh="保存筛选方案" data-en="Save screener preset"></h2>
      <label class="control"><span data-zh="方案名称" data-en="Preset name"></span>
        <input id="preset-name" type="text" required maxlength="40" autocomplete="off" autofocus>
      </label>
      <div class="naming-dialog-actions">
        <button type="button" class="quiet" id="cancel-preset" data-zh="取消" data-en="Cancel"></button>
        <button type="submit" class="primary" value="save" data-zh="保存" data-en="Save"></button>
      </div>
    </form>
  </dialog>
  <div id="term-tooltip" class="term-tooltip" role="tooltip" hidden></div>
  <noscript>请启用 JavaScript。 Enable JavaScript to use this workbench.</noscript>
</body>
</html>
