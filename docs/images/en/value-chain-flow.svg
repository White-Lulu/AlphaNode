<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="205" viewBox="0 0 1000 205" role="img" aria-labelledby="title desc">
  <title id="title">Value Chain Atlas</title>
  <desc id="desc">Choose a pathway, trace inputs and outputs, expand equipment branches, and check sources.</desc>
  <!-- Font subset from Adobe Source Han Serif CN. See SOURCE-HAN-SERIF-LICENSE.txt. -->
  <style>@font-face{font-family:DiagramSerif;src:url(data:font/woff;base64,) format("woff");}</style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8Z" fill="#747e8a"/></marker></defs>
  <rect width="1000" height="205" fill="#fff"/>
  <g font-family="DiagramSerif, Source Han Serif SC, Noto Serif SC, SimSun, serif" text-anchor="middle">
    <rect x="399" y="15" width="202" height="42" rx="2" fill="#eaf2fd" stroke="#9db6d3"/>
    <text x="500" y="43" fill="#244c77" font-size="20">Value Chain Atlas</text>
    <rect x="22" y="77" width="221" height="100" rx="2" fill="#f7f8fa" stroke="#d0d5db"/>
    <text x="132.5" y="106" fill="#273443" font-size="15.8">Select pathways</text>
    <text x="132.5" y="133" fill="#4c5662" font-size="13.8">Industries or companies</text>
    <text x="132.5" y="155" fill="#4c5662" font-size="13.8">Compare several pathways</text>
    <path d="M248 124H264" stroke="#747e8a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="267" y="77" width="221" height="100" rx="2" fill="#f7f8fa" stroke="#d0d5db"/>
    <text x="377.5" y="106" fill="#273443" font-size="15.8">Trace inputs and outputs</text>
    <text x="377.5" y="133" fill="#4c5662" font-size="13.8">Boxes and triangles</text>
    <text x="377.5" y="155" fill="#4c5662" font-size="13.8">Ellipses show direct use</text>
    <path d="M493 124H509" stroke="#747e8a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="512" y="77" width="221" height="100" rx="2" fill="#f7f8fa" stroke="#d0d5db"/>
    <text x="622.5" y="106" fill="#273443" font-size="15.8">Expand equipment</text>
    <text x="622.5" y="133" fill="#4c5662" font-size="13.8">Use + on a node</text>
    <text x="622.5" y="155" fill="#4c5662" font-size="13.8">Trace how tools are made</text>
    <path d="M738 124H754" stroke="#747e8a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="757" y="77" width="221" height="100" rx="2" fill="#f7f8fa" stroke="#d0d5db"/>
    <text x="867.5" y="106" fill="#273443" font-size="15.8">Check sources</text>
    <text x="867.5" y="133" fill="#4c5662" font-size="13.8">See companies and filings</text>
    <text x="867.5" y="155" fill="#4c5662" font-size="13.8">and disclosed relationships</text>
  </g>
</svg>
