    <rect x="741" y="217" width="232" height="98" rx="2" fill="#ffffff" stroke="#d0d5db"/>
    <text x="755" y="249" fill="#273443" font-size="18" font-weight="650" text-anchor="start">serve.py · local server</text>
    <text x="755" y="274" fill="#4c5662" font-size="15" font-weight="400" text-anchor="start">Advanced screens and prices</text>
    <text x="755" y="295" fill="#4c5662" font-size="15" font-weight="400" text-anchor="start">server/ · AI</text>
