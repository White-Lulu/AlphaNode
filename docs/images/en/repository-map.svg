<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">Repository structure and data flow</title>
  <desc id="desc">Python combines source data with the rules in config to build JSON, DuckDB and Parquet. serve.py provides the browser app and runtime endpoints.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#747e8a"/></marker></defs>
  <g font-family="Georgia, Times New Roman, serif">
    <rect width="1000" height="290" fill="#fff"/>
    <g transform="translate(0 -50)">
    <text x="116" y="88" fill="#244c77" font-size="16" font-weight="650" text-anchor="middle">Inputs</text>
    <text x="345.5" y="88" fill="#244c77" font-size="16" font-weight="650" text-anchor="middle">Collect and compute</text>
    <text x="587.5" y="88" fill="#244c77" font-size="16" font-weight="650" text-anchor="middle">Generated files</text>
    <text x="857" y="88" fill="#244c77" font-size="16" font-weight="650" text-anchor="middle">Runtime</text>
    <path d="M205 153 H226 V185 H247" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <path d="M205 262 H226 V220 H247" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <path d="M443 185 H460 V153 H479" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <path d="M443 220 H460 V262 H479" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <path d="M695 153 H740" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <path d="M695 262 H740" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <path d="M857 217 V199" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <rect x="27" y="106" width="178" height="93" rx="2" fill="#ffffff" stroke="#d0d5db"/>
    <text x="41" y="137" fill="#273443" font-size="18" font-weight="650" text-anchor="start">Source data</text>
    <text x="41" y="162" fill="#4c5662" font-size="13" font-weight="400" text-anchor="start">Filings, official statistics</text>
    <text x="41" y="183" fill="#4c5662" font-size="15" font-weight="400" text-anchor="start">Markets, securities</text>
    <rect x="27" y="217" width="178" height="98" rx="2" fill="#ffffff" stroke="#d0d5db"/>
    <text x="41" y="260" fill="#273443" font-size="18" font-weight="650" text-anchor="start">config/</text>
    <text x="41" y="285" fill="#4c5662" font-size="11" font-weight="400" text-anchor="start">Sample and classification rules</text>
    <rect x="248" y="155" width="195" height="96" rx="2" fill="#eaf2fd" stroke="#9db6d3"/>
    <text x="262" y="186" fill="#244c77" font-size="18" font-weight="650" text-anchor="start">pipeline/refresh.py</text>
    <text x="262" y="211" fill="#4c5662" font-size="12" font-weight="400" text-anchor="start">pipeline/ · collect and compute</text>
    <text x="262" y="232" fill="#4c5662" font-size="15" font-weight="400" text-anchor="start">verify.py · validate data</text>
    <rect x="480" y="106" width="215" height="93" rx="2" fill="#ffffff" stroke="#d0d5db"/>
    <text x="494" y="147" fill="#273443" font-size="16" font-weight="650" text-anchor="start">JSON for the browser</text>
    <text x="494" y="172" fill="#4c5662" font-size="15" font-weight="400" text-anchor="start">dist/data/ · dist/research/</text>
    <rect x="480" y="217" width="215" height="98" rx="2" fill="#ffffff" stroke="#d0d5db"/>
    <text x="494" y="249" fill="#273443" font-size="18" font-weight="650" text-anchor="start">warehouse/</text>
