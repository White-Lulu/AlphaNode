    <path d="M840 215 V178" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
    <text x="852" y="201" fill="#244c77" font-size="14" font-weight="400" text-anchor="start">Analyze merged charts</text>
    <path d="M192 254 H424" fill="none" stroke="#747e8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" marker-end="url(#arrow)"/>
