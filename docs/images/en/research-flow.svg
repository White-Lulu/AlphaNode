    <text x="284.5" y="128" fill="#244c77" font-size="14" font-weight="650" text-anchor="middle">Trend comparison</text>
    <text x="284.5" y="153" fill="#4c5662" font-size="13" font-weight="400" text-anchor="middle">Line charts and values</text>
    <rect x="42" y="215" width="150" height="86" rx="2" fill="#ffffff" stroke="#d0d5db"/>
