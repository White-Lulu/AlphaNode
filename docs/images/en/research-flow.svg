<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346" role="img" aria-labelledby="title desc">
  <title id="title">Trend comparison and workbench</title>
  <desc id="desc">Add table series to trends, save charts, analyze with AI or arrange and merge rows in the workbench. Star companies to add them to the watchlist.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#747e8a"/></marker></defs>
